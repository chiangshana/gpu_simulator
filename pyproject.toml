[project]
name = "gpu_simulator"
version = "0.10.0"
description = "Interactive CPU↔GPU teaching simulator + personal-machine hardware dashboard. Write Tiny8 ASM to see cycle-by-cycle register/memory/SREG heatmaps; same window also shows your real machine's per-core CPU + GPU usage live. 100% Python, PEP 8, PySide6, SQLite."
readme = "README.md"
authors = [{ name = "shana chiang", email = "chiangshana@gmail.com" }]
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Topic :: Education",
    "Topic :: System :: Hardware",
]
dependencies = [
    "PySide6>=6.6",
    "pynput>=1.7.6",
    "psutil>=5.9",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
realgpu = [
    "pynvml>=11.5",
    "GPUtil>=1.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
gpu-simulator = "gpu_simulator.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# 100 對純英文程式很合理,但本專案大量中文 docstring / 字串/ help 文字,
# 中日韓字 Pango width 算 2,常常會超過 100;110 是務實的折衷。
line-length = 110
target-version = "py310"
# tiny8_full/ 是 vendor 進來的上游 Tiny8 source(MIT),不在我們的程式風格範圍內。
extend-exclude = ["src/gpu_simulator/tiny8_full"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
# `from ... import CPU as Tiny8CPU` — CPU 是類別名,不是常數,N811 誤判。
ignore = ["N811"]

[tool.ruff.lint.per-file-ignores]
# i18n 中文長字串值不要強制斷行,讀起來反而醜。
"src/gpu_simulator/i18n.py" = ["E501"]
# 預設 asm 註解模板裡的中文行也允許略超 100。
"src/gpu_simulator/cpu.py" = ["E501"]
# 對話框裡的「重點觀察」中文字串,斷行會破壞排版可讀性。
"src/gpu_simulator/dialogs.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
